[project]
name = "exchange-simulator-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "scikit-learn>=1.3"]
rl = ["stable-baselines3>=2.0", "gymnasium>=0.29"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Without this, setuptools tries to auto-discover packages, finds engine/,
# bindings/ and dashboard/ next to the Python ones, and refuses to guess. That
# made `pip install .` fail outright, so the declared dependencies above were
# unreachable. The compiled `exchange_simulator` module is not listed: it comes
# from the CMake build and is imported through PYTHONPATH.
[tool.setuptools]
packages = ["agents", "data", "features", "gateway", "rl", "simulation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Ruff's own default rule set: the pycodestyle errors that indicate a real
# problem, plus all of pyflakes. Named explicitly so a new ruff release cannot
# widen it and turn CI red without a code change. The wider style rules are
# deliberately left out: they would mean reformatting every file to change no
# behaviour, and the useful part of linting here was pyflakes, which found dead
# code and an undefined name.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
