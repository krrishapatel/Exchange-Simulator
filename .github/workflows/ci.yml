name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: C++ engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  agents:
    name: Python agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The Python tests import the compiled bindings, so the engine has to be
      # built here too rather than reused from the job above.
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j --target exchange_simulator
      - run: pip install -e ".[dev,rl]"
      - run: PYTHONPATH=build/bindings:. pytest tests/ -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned, so a new ruff release cannot turn this red without a change
      # here. The rule set is pinned in pyproject for the same reason.
      - run: pip install ruff==0.15.20
      - run: ruff check .
